name: PlantUML

# The hand-written global diagrams spell their promotion directives in PlantUML's
# own syntax, so that what an author writes is also what a reader looks at. Only
# PlantUML can say whether a spelling still renders. This is a workflow of its own
# because it sets up a JRE and PlantUML, and the Go tests must stay fast.
#
# PlantUML comes as a pinned jar from its GitHub release rather than from apt:
# the runner's apt mirror is often slow enough to time the job out. Graphviz is
# not installed, because -checkonly parses a diagram without laying it out.
on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:

jobs:
  render:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    env:
      # Without this a runner that lost PlantUML would skip the check and report
      # a pass.
      CSDF_REQUIRE_PLANTUML: '1'
      PLANTUML_VERSION: '1.2026.9'
      # The digest GitHub publishes for plantuml-1.2026.9.jar in that release.
      PLANTUML_SHA256: aa4a1d06f8911c4b842beff4828dd955be431692b631a312d04c0e9fab9581de

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache PlantUML
        id: plantuml-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/plantuml
          key: plantuml-${{ env.PLANTUML_VERSION }}-${{ env.PLANTUML_SHA256 }}

      - name: Download PlantUML
        if: steps.plantuml-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/plantuml
          curl -fsSL --retry 3 --max-time 120 -o ~/.cache/plantuml/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"

      - name: Verify PlantUML and put it on PATH
        run: |
          set -euo pipefail
          echo "${PLANTUML_SHA256}  ${HOME}/.cache/plantuml/plantuml.jar" | sha256sum -c -
          mkdir -p ~/.local/bin
          printf '#!/bin/sh\nexec java -Djava.awt.headless=true -jar "%s" "$@"\n' \
            "${HOME}/.cache/plantuml/plantuml.jar" > ~/.local/bin/plantuml
          chmod +x ~/.local/bin/plantuml
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"

      - name: Render the global diagrams
        run: go test -v ./examples/rendercheck/
