archives:
  - id: default
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "csdfparallel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids:
      - csdfparallel
      - csdfhide
      - csdfpromote
      - csdfcomp
      - csdfparse
      - csdfinclude
      - csdfevents
      - csdfrepl
      - csdfsort
      - csdfdecorate
      - csdfslice
      - csdflint
      - csdflivelockfree
      - csdftracechk
      - csdftranstable
      - csdfrefinement
      - csdfreplweb
      - csdfrepld
      - csdfreplcmd
      - obligationirc
      - csdfhelp
      - csdfbmc
    files:
      - README.md
      - LICENSE*
      - docs/**/*
      - examples/**/*

checksum:
  name_template: "checksums.txt"

  extra_files:
    - glob: tools/replweb/engineload/embedded/engine.wasm.gz
      name_template: "csdfreplweb-engine_{{ .Version }}.wasm.gz"

release:
  prerelease: auto
  extra_files:
    - glob: tools/replweb/engineload/embedded/engine.wasm.gz
      name_template: "csdfreplweb-engine_{{ .Version }}.wasm.gz"
