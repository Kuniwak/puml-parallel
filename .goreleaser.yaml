version: 2

# csdfreplweb embeds the engine of its page, built for WebAssembly here and
# attached to the release on its own for csdfreplweb -engine.
before:
  hooks:
    - go run ./tools/replweb/internal/buildengine -version {{ .Version }}

builds:
  - id: csdfparallel
    main: ./tools/csdfparallel/main.go
    binary: csdfparallel
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/Kuniwak/puml-parallel/v9/version.Version={{ .Version }}

  - id: csdfpromote
    main: ./tools/csdfpromote/main.go
    binary: csdfpromote
    goos:
